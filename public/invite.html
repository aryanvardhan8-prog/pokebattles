<!doctype html>
<!-- Invite links land here (…/invite.html?u=USERNAME) so chats show an "invited" preview,
     then the game opens with ?invite=USERNAME (which makes you friends once you're logged in). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You've been challenged on DailyBattles</title>
  <meta name="description" content="A friend challenged you to a Pokémon battle on DailyBattles. Pick your team and battle head to head.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="A friend challenged you to a battle!">
  <meta property="og:description" content="Pick your team. Battle head to head on DailyBattles.">
  <meta property="og:site_name" content="DailyBattles">
  <meta property="og:url" content="https://dailybattles.netlify.app/invite.html">
  <meta property="og:image" content="https://dailybattles.netlify.app/icons/invite-og.jpg">
  <meta property="og:image:secure_url" content="https://dailybattles.netlify.app/icons/invite-og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="A friend challenged you to a battle on DailyBattles">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://dailybattles.netlify.app/icons/invite-og.jpg">
  <meta name="twitter:title" content="A friend challenged you to a battle!">
  <meta name="theme-color" content="#e3262e">
  <style>body{margin:0;background:#f4f4f6;font-family:system-ui,sans-serif;display:grid;place-items:center;height:100vh;color:#111114}</style>
</head>
<body>
  <p>Opening DailyBattles…</p>
  <script>
    var u = new URLSearchParams(location.search).get('u') || '';
    var m = new URLSearchParams(location.search).get('m') || '';
    location.replace('/?' + (u ? 'invite=' + encodeURIComponent(u) : '') + (m ? '&match=' + encodeURIComponent(m) : '') + location.hash); // keeps #move=... (data handed over from the old address)
  </script>
</body>
</html>
