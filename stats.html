  <style>/* inline so the loading screen is styled before the scripts arrive */

#loader { position: fixed; inset: 0; z-index: 1200; display: grid; place-content: center; justify-items: center; gap: 18px;
  background: #f4f4f6; font-family: Nunito, system-ui, sans-serif; transition: opacity .25s ease, visibility .25s; }
#loader.gone { opacity: 0; visibility: hidden; pointer-events: none; }
#loader .ld-brand { font-family: 'Plus Jakarta Sans', Nunito, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.03em; color: #14141a; }
#loader .ld-brand span { color: #e3262e; }
#loader .ld-ball { width: 56px; height: 56px; border-radius: 50%; border: 4px solid #14141a;
  background: radial-gradient(circle, #fff 0 6px, #14141a 6px 10px, transparent 10px), linear-gradient(#e3262e 0 45%, #14141a 45% 55%, #fff 55%);
  animation: ldspin 1s cubic-bezier(.5,.1,.5,.9) infinite; }
#loader p { margin: 0; font-weight: 800; font-size: 15px; color: #6b6b76; }
@keyframes ldspin { to { transform: rotate(360deg); } }
  html, body { background: #f4f4f6; }
  </style>
  <script>
// DailyBattles: unpacks saved data handed over from the old address (pokebattles1 → dailybattles), before the game starts.
// The old site sends people to the same page here with #move=<data>. Keys already saved here are never overwritten.
(function () {
  var h = location.hash;
  if (h.indexOf('#move=') !== 0) return;
  window.__moving = true;
  var raw = h.slice(6), kind = raw[0], b64 = raw.slice(1).replace(/-/g, '+').replace(/_/g, '/');
  var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
  var text = kind === 'z' && window.DecompressionStream
    ? new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()
    : Promise.resolve(new TextDecoder().decode(bytes));
  text.then(function (t) {
    var data = JSON.parse(t);
    for (var k in data) { try { if (localStorage.getItem(k) === null) localStorage.setItem(k, data[k]); } catch (e) { /* full / blocked */ } }
  }).catch(function () {}).then(function () {
    location.replace(location.pathname + location.search);
  });
})();
  </script>
</head>
<body>
  <!-- Netlify Forms needs the form in the HTML to detect it; the real form is on the menu (src/home.ts). -->
  <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="kind"><textarea name="message"></textarea><input name="contact"><input name="username"><input name="page"><input name="device"><input name="bot-field">
  </form>
  <div id="loader" role="status" aria-live="polite"><div class="ld-brand"><span>DAILY</span>BATTLES</div><i class="ld-ball" aria-hidden="true"></i><p id="loader-text">Loading…</p></div>
  <button id="mute" aria-label="Sound on">🔊</button>
  <button id="fullscreen" aria-label="Full screen" title="Full screen (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="game-home" aria-label="Back to the menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7M6.5 9.5V20h11V9.5"/></svg></button>
  <main id="app">
    <div id="timer" role="timer" aria-live="off"></div>
    <div id="screen-wrap">
      <canvas id="screen" width="160" height="144" aria-label="Game screen"></canvas>
    </div>
    <div id="controls">
      <div class="dpad">
        <button data-btn="up" class="d up" aria-label="Up"></button>
        <button data-btn="left" class="d left" aria-label="Left"></button>
        <span class="d mid"></span>
        <button data-btn="right" class="d right" aria-label="Right"></button>
        <button data-btn="down" class="d down" aria-label="Down"></button>
      </div>
      <div class="ab">
        <button data-btn="b" class="round b" aria-label="B">B</button>
        <button data-btn="a" class="round a" aria-label="A">A</button>
      </div>
      <div class="ss">
        <button data-btn="select" class="pill" aria-label="Select"><span>SELECT</span></button>
        <button data-btn="start" class="pill" aria-label="Start"><span>START</span></button>
      </div>
    </div>
    <p id="keys">Arrows / WASD: move<br>Z or Enter: A<br>X or Backspace: B<br>M: START menu<br>Shift: sound on/off<br>F: full screen<br>Or click the screen</p>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
