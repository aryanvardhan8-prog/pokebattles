<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokeBattles Pokédex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tiny5&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #15161f; --card: #f8f8f8; --ink: #181818; --muted: #666; --line: #d8d8d8; --accent: #e03820; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--card); font: 15px/1.4 "Tiny5", monospace; }
    header { position: sticky; top: 0; z-index: 2; background: #2b2d42; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; box-shadow: 0 3px 0 #1d1e2c; }
    h1 { font: 14px "Press Start 2P"; margin: 0 12px 0 0; color: #fff; }
    h1 span { color: var(--accent); }
    input, select { font: inherit; padding: 6px 8px; border-radius: 4px; border: 0; }
    #count { margin-left: auto; opacity: .7; }
    main { padding: 16px; max-width: 1400px; margin: 0 auto; }
    h2 { font: 12px "Press Start 2P"; margin: 28px 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .card { background: var(--card); color: var(--ink); border: 4px double var(--ink); border-radius: 6px; padding: 10px; }
    .top { display: flex; gap: 8px; align-items: flex-end; }
    .top img { image-rendering: pixelated; }
    .front { width: 112px; height: 112px; }
    .top canvas { image-rendering: auto; }
    .back { width: 64px; height: 64px; }
    .name { font: 11px "Press Start 2P"; margin: 0 0 4px; }
    .num { color: var(--muted); }
    .types { display: flex; gap: 4px; margin: 4px 0; flex-wrap: wrap; }
    .type { font-size: 12px; padding: 1px 6px; border-radius: 3px; color: #fff; }
    .tag { font-size: 12px; padding: 1px 6px; border-radius: 3px; background: #ffe08a; color: #6b4b00; }
    table { width: 100%; border-collapse: collapse; margin: 6px 0; }
    td { padding: 1px 0; }
    td:first-child { width: 64px; color: var(--muted); }
    .bar { height: 7px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .bar i { display: block; height: 100%; }
    td.v { width: 34px; text-align: right; }
    details { margin-top: 4px; }
    summary { cursor: pointer; color: var(--muted); }
    .moves { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0; }
    .mv { font-size: 12px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
    .mv b { font-weight: normal; color: var(--muted); }
    .other { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
    .other figure { margin: 0; background: var(--card); color: var(--ink); padding: 10px; border-radius: 6px; text-align: center; }
    .other img, .other canvas { image-rendering: pixelated; display: block; margin: 0 auto 6px; }
    figcaption { font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1><span>POKE</span>BATTLES Pokédex</h1>
    <input id="q" type="search" placeholder="Search name, type or move…">
    <select id="type"><option value="">All types</option></select>
    <select id="sort">
      <option value="num">Sort: Pokédex #</option>
      <option value="height">Sort: height</option>
      <option value="total">Sort: total stats</option>
      <option value="hp">Sort: HP</option>
      <option value="atk">Sort: Attack</option>
      <option value="def">Sort: Defense</option>
      <option value="spc">Sort: Special</option>
      <option value="spe">Sort: Speed</option>
    </select>
    <span id="count"></span>
  </header>
  <main>
    <div class="grid" id="grid"></div>
    <h2>Other graphics in the game</h2>
    <div class="other" id="other"></div>
  </main>
  <script type="module" src="/src/pokedex.ts"></script>
</body>
</html>
